name: Live feed diagnostic (read-only)
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_live_feed.py"
      - ".github/workflows/live-probe.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read-only official feed probe
        run: python scripts/probe_live_feed.py
